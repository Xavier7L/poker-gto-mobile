<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poker GTO">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060a10">
<title>德州扑克训练台 · Mobile</title>
<style>
  :root{
    --bg:#0a0e17;--surface:#111827;--surface2:#1a2332;--border:#253345;
    --felt1:#0f8c60;--felt2:#0a7550;--felt3:#065e3c;
    --gold:#e8b94a;--goldDim:#b8942f;--goldGlow:rgba(232,185,74,.4);
    --red:#e0493c;--redDark:#b33528;
    --green:#2ecc71;--greenDark:#1f8c4e;
    --blue:#3498db;--blueDark:#2471a3;
    --text:#f0f5fa;--text2:#94a3b8;--text3:#64748b;
    --warn:#f39c12;--good:#27ae60;--bad:#e74c3c;
    --mono:'Menlo','Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    --radius:12px;--radiusSm:8px;
    --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
    --sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
    --tabh:38px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;height:100%;width:100%;touch-action:manipulation}
  body{padding-top:calc(var(--sat) + var(--tabh) + 4px);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}
  .topbar{display:none}
  .main{display:flex;flex-direction:column;height:100%;overflow:hidden}
  .tabcontent{display:none;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 10px 4px}
  #tabTable{overflow:hidden}
  .tabcontent.active{display:flex;flex-direction:column}
  .tabbar{position:fixed;top:var(--sat);left:50%;transform:translateX(-50%);height:var(--tabh);display:flex;gap:2px;padding:0 6px;background:rgba(17,24,39,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:20px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border:none;background:none;color:var(--text3);font-size:7px;font-family:var(--sans);cursor:pointer;padding:2px 10px;border-radius:16px;transition:all .12s}
  .tabbar button .ico{font-size:15px;line-height:1}
  .tabbar button.active{color:var(--gold);background:rgba(232,185,74,.1)}
  .tabbar button:active{opacity:.6}
  .table-area{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .tablewrap{position:relative;background:radial-gradient(ellipse 90% 55% at 50% 46%,rgba(255,255,255,.06) 0%,transparent 60%),radial-gradient(ellipse 100% 65% at 50% 48%,#12a06e 0%,var(--felt1) 30%,var(--felt2) 60%,var(--felt3) 100%);border:9px solid #1e2a36;border-radius:50%;box-shadow:inset 0 0 60px rgba(0,0,0,.3),0 8px 40px rgba(0,0,0,.5);width:94vw;max-width:100%;height:70vh;flex-shrink:0;overflow:visible}
  .tablewrap::after{content:'';position:absolute;inset:12px;border:1px solid rgba(255,255,255,.04);border-radius:50%;pointer-events:none}
  .tablewrap::before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.008) 0deg 1deg,transparent 1deg 3deg);pointer-events:none}
  .center{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);text-align:center;width:80%}
  .board{display:flex;gap:5px;justify-content:center;min-height:48px;align-items:center}
  .street{display:inline-block;font-family:var(--mono);font-size:10px;color:#b8e6d8;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;background:rgba(0,0,0,.5);border:1px solid rgba(232,185,74,.22);border-radius:8px;padding:3px 10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .pot{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13px;color:#eef5f0;margin-top:6px;background:rgba(0,0,0,.65);border:1.5px solid rgba(232,185,74,.3);border-radius:12px;padding:5px 14px;box-shadow:0 3px 14px rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .pot b{color:var(--gold);font-size:18px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .pot::before{content:'';width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e8b94a 45%,#8a6420);box-shadow:0 0 6px rgba(232,185,74,.35)}
  .card{width:34px;height:48px;border-radius:5px;background:linear-gradient(180deg,#fff 0%,#f8f4ec 100%);color:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-family:var(--mono);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.1);flex:0 0 auto;position:relative}
  .card .r{font-size:15px;line-height:1}.card .s{font-size:11px;line-height:1;margin-top:1px}
  .card.red{color:#d63031}
  .card.back{background:linear-gradient(135deg,#1a2a3a 0%,#0f1923 50%,#1a2a3a 100%);border:1.5px solid #2c3d50;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .card.back::after{content:'';position:absolute;inset:3px;border:1px solid rgba(232,185,74,.2);border-radius:3px;background:repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(232,185,74,.06) 2px,rgba(232,185,74,.06) 4px)}
  .card.sm{width:24px;height:34px;border-radius:3px}.card.sm .r{font-size:11px}.card.sm .s{font-size:8px}
  .card.deal{animation:dealCard .35s cubic-bezier(.25,.46,.45,.94) both}
  @keyframes dealCard{from{opacity:0;transform:scale(.6) translateY(-15px) rotate(-5deg)}to{opacity:1;transform:scale(1) translateY(0) rotate(0)}}
  .card.empty{opacity:.04;background:rgba(255,255,255,.03);box-shadow:none;border:1px dashed rgba(255,255,255,.06)}
  .seat.hero .holes .card{width:46px;height:64px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.12);animation:heroGlow 3s ease-in-out infinite alternate}
  .seat.hero .holes .card .r{font-size:20px}
  .seat.hero .holes .card .s{font-size:15px}
  @keyframes heroGlow{from{box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.12)}to{box-shadow:0 4px 20px rgba(232,185,74,.2),0 0 0 1.5px rgba(255,255,255,.18),0 0 25px rgba(232,185,74,.1)}}
  .seat{position:absolute;width:82px;transform:translate(-50%,-50%);text-align:center;z-index:2;transition:opacity .25s}
  .seat.folded{opacity:.3}
  .avwrap{position:relative;width:44px;height:44px;margin:0 auto}
  .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;border:3px solid rgba(255,255,255,.18);box-shadow:0 3px 12px rgba(0,0,0,.5),inset 0 -2px 4px rgba(0,0,0,.2);position:relative;z-index:2;transition:all .15s;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .seat.active .avwrap::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2.5px solid rgba(255,255,255,.7);box-shadow:0 0 10px rgba(255,255,255,.25);animation:ringpulse 1.5s ease-in-out infinite;z-index:1}
  @keyframes ringpulse{50%{border-color:rgba(255,255,255,.9);box-shadow:0 0 16px rgba(255,255,255,.35)}}
  .seat.win .avatar{border-color:#4ade80;box-shadow:0 0 16px rgba(74,222,128,.5),0 0 30px rgba(74,222,128,.2)}
  .seat.win{animation:winBounce .5s ease 3}
  @keyframes winBounce{50%{transform:translate(-50%,-50%) translateY(-4px)}}
  .namepill{margin-top:2px;display:inline-block;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:2px 8px;font-size:9px;font-weight:700;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
  .namepill .arch{font-size:7px;color:var(--text2);font-family:var(--mono);margin-left:2px}
  .stackpill{margin-top:2px;display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,rgba(232,185,74,.15),rgba(139,105,20,.1));border:1px solid rgba(232,185,74,.35);color:var(--gold);border-radius:8px;padding:2px 8px;font-family:var(--mono);font-size:10px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .stackpill::before{content:'';width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e8b94a 50%,#8a6420);box-shadow:0 0 4px rgba(232,185,74,.3)}
  .actlab{font-family:var(--mono);font-size:9px;letter-spacing:.04em;min-height:12px;margin-top:2px;text-transform:uppercase;font-weight:600}
  .seat .badge{position:absolute;top:-4px;right:-6px;background:linear-gradient(135deg,#ffe9a8,#e8b94a);color:#3a2608;font-size:9px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15)}
  .seat .holes{position:absolute;left:50%;top:-22px;transform:translateX(-50%);display:flex;gap:3px;z-index:3}
  .seat.hero .holes{top:-52px}
  .seat .bet{position:absolute;left:50%;transform:translateX(-50%);top:-38px;display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(232,185,74,.3);padding:3px 8px;border-radius:10px;white-space:nowrap;z-index:5;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .seat .bet::before{content:'';width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe0e0,#e0493c 50%,#8b1a1a);box-shadow:0 0 4px rgba(224,73,60,.3)}
  .seat.hero .bet{top:-76px}.seat.top .bet{top:auto;bottom:-18px}
  .seat.top{top:18%!important}
  .controls{background:linear-gradient(180deg,var(--surface) 0%,#0d1520 100%);border:1px solid var(--border);border-top:2px solid rgba(232,185,74,.15);border-radius:16px 16px 0 0;padding:8px 10px 20px;margin-top:4px;flex-shrink:1}
  .actrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button.gbtn{font-family:var(--sans);font-weight:700;border:none;padding:12px 8px;border-radius:22px;cursor:pointer;font-size:13px;transition:all .12s;-webkit-tap-highlight-color:transparent;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.3);position:relative;overflow:hidden}
  button.gbtn:active:not(:disabled){transform:scale(.96);filter:brightness(1.1)}
  button.gbtn:disabled{opacity:.25;cursor:not-allowed;filter:grayscale(.5)}
  button.fold{background:linear-gradient(135deg,#c0392b,#8b1a1a);color:#ffd0cc;border:1px solid rgba(192,57,43,.15);box-shadow:0 3px 12px rgba(192,57,43,.3)}
  button.call{background:linear-gradient(135deg,#27ae60,#1a7a40);color:#d0ffe8;border:1px solid rgba(39,174,96,.15);box-shadow:0 3px 12px rgba(39,174,96,.3)}
  button.raise{background:linear-gradient(135deg,#e8b94a,#a67c2e);color:#2a1a04;border:1px solid rgba(232,185,74,.2);box-shadow:0 3px 12px rgba(232,185,74,.35)}
  button.primary{background:linear-gradient(135deg,#2e86c1,#1a5f8a);color:#e0f0ff;border:1px solid rgba(52,152,219,.15);box-shadow:0 3px 12px rgba(52,152,219,.3)}
  .actrow button.gbtn{flex:1;min-width:0;text-align:center}
  .sizer{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 14px;background:var(--surface2);border-radius:20px;border:1px solid var(--border)}
  .sizer input[type=range]{flex:1;accent-color:var(--gold);height:6px}
  .sizer .amt{font-family:var(--mono);font-size:13px;color:var(--gold);min-width:60px;font-weight:700}
  .chips{display:flex;gap:4px;padding:4px 8px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;border:1px solid rgba(255,255,255,.07);box-shadow:0 3px 14px rgba(0,0,0,.3)}
  .chips button{padding:6px 10px;font-size:9px;font-family:var(--mono);background:rgba(30,42,54,.7);color:var(--text2);border:1px solid rgba(255,255,255,.08);border-radius:14px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .1s}
  .chips button:active{background:var(--gold);color:#2a1a04;border-color:var(--gold)}
  .hint{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:5px;min-height:12px;text-align:center}
  .table-bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;z-index:10}
  .cwrap{position:relative;width:42px;height:42px;flex-shrink:0;touch-action:none;user-select:none;-webkit-user-select:none}
  .cicon{width:42px;height:42px;border-radius:50%;background:rgba(17,24,39,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(232,185,74,.35);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.4);transition:transform .15s ease}
  .cicon:active{transform:scale(.92)}
  .cicon .cdot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--gold);border-radius:50%;box-shadow:0 0 6px var(--gold);display:none}
  .coach{position:absolute;bottom:50px;left:-8px;width:250px;max-height:50vh;overflow-y:auto;background:rgba(17,24,39,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(232,185,74,.22);border-radius:14px;padding:28px 12px 10px 12px;font-size:11px;line-height:1.4;display:none;box-shadow:0 8px 32px rgba(0,0,0,.55);z-index:20}
  .cwrap.expanded .coach{display:block;animation:slideUp .2s ease}
  .cwrap:not(.expanded) .coach{display:none}
  .cwrap.expanded .cicon .cdot{display:none}
  .coach-x{position:absolute;top:7px;right:10px;font-size:15px;color:var(--text3);cursor:pointer;line-height:1;padding:2px 4px;z-index:3;display:none}
  .cwrap.expanded .coach-x{display:block}
  .coach-x:active{color:var(--text)}
  .coach.show{}
  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .coach .lead{color:var(--gold);font-weight:700;font-family:var(--mono);font-size:11px}
  .coach .num{font-family:var(--mono);color:var(--blue)}
  .coach-main{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .coach-brief{margin-top:3px;font-size:10px;line-height:1.45;color:var(--text)}
  .verdict{display:inline-block;font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:4px;margin-left:3px;font-weight:700}
  .verdict.ok{background:rgba(39,174,96,.1);color:var(--good)}
  .verdict.warn{background:rgba(243,156,18,.1);color:var(--warn)}
  .verdict.bad{background:rgba(231,76,60,.1);color:var(--bad)}
  .evrows{margin-top:4px}
  .evrow{display:flex;align-items:center;gap:3px;font-size:9px;font-family:var(--mono);margin-bottom:2px}
  .evlab{width:75px;color:var(--text2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evrow.rec .evlab,.evrow.rec .evval{color:var(--gold);font-weight:700}
  .evbar{flex:1;height:5px;background:#080d14;border-radius:3px;overflow:hidden}
  .evbar i{display:block;height:100%;border-radius:3px}
  .evval{width:30px;text-align:right;color:var(--text);font-weight:600}
  .strategy-bar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:3px 0;border:1px solid var(--border)}
  .strategy-bar div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;font-weight:700;color:#fff}
  .strat-fold{background:#5c2626}.strat-call{background:#1f7a4e}.strat-raise{background:#d4a546;color:#2a1a04}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:8px}
  .panel h2{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin:0 0 6px;font-weight:700;display:flex;align-items:center;gap:5px}
  .panel h2::after{content:'';flex:1;height:1px;background:var(--border)}
  .stat{display:flex;justify-content:space-between;align-items:center;font-size:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.02)}
  .stat:last-child{border-bottom:none}.stat .k{color:var(--text2)}.stat .v{font-family:var(--mono);color:var(--text);font-weight:600}
  .bar{height:3px;background:#080d14;border-radius:2px;overflow:hidden;margin-top:2px}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
  .read{font-size:10px;line-height:1.45;color:var(--text)}
  .read .lab{font-family:var(--mono);font-size:8px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;display:inline-block;padding:1px 3px;background:rgba(212,165,70,.06);border-radius:3px;margin-right:2px}
  .toggle{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2);cursor:pointer;padding:3px 0}
  .toggle input{accent-color:var(--gold);width:14px;height:14px}
  .log{font-family:var(--mono);font-size:9px;line-height:1.5;color:var(--text2)}
  .log .h{color:var(--gold)}.log .w{color:var(--good)}.log .me{color:var(--blue)}
  .miscrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .miscrow button{padding:7px 10px;font-size:9px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:14px;font-weight:600;cursor:pointer}
  .rangectl{display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:9px;color:var(--text2)}
  .rangectl select{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 6px;font-size:10px;font-family:var(--sans)}
  .rangegrid{display:grid;grid-template-columns:repeat(13,1fr);gap:1px}
  .rangegrid .cell{aspect-ratio:1;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:6px;font-weight:700;color:#0c1218;position:relative}
  .rangegrid .cell.fold{color:var(--text3)}
  .rangegrid .cell.here{outline:1.5px solid #fff;outline-offset:-1px;z-index:3}
  .rangegrid .cell.here::after{content:'\2605';position:absolute;top:-2px;right:-1px;font-size:5px;color:#fff;text-shadow:0 0 2px #000}
  .rangekey{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:8px;color:var(--text2)}
  .rangekey span{display:flex;align-items:center;gap:2px}
  .rangekey i{width:7px;height:7px;border-radius:2px;display:inline-block}
  .gto-gauges{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin:4px 0}
  .gauge{background:var(--surface2);border-radius:5px;padding:5px;text-align:center;border:1px solid var(--border)}
  .gauge .gv{font-family:var(--mono);font-size:13px;font-weight:800}
  .gauge .gl{font-size:7px;color:var(--text2);margin-top:1px;text-transform:uppercase;letter-spacing:.05em}
  #tracker{font-family:var(--mono);font-size:9px;color:var(--text2);line-height:1.4}
  #tracker svg{width:100%;height:auto}
  .tablepreset{display:flex;gap:3px;margin:4px 0}
  .tablepreset button{flex:1;padding:7px 3px;font-size:9px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-weight:600}
  .tablepreset button:active{background:var(--gold);color:#2a1a04}
  .botstyle-row{display:flex;align-items:center;gap:4px;margin-top:3px}
  .botstyle-row .bn{width:36px;font-size:9px;font-weight:700}
  .botstyle-row select{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:4px 5px;font-size:9px;font-family:var(--sans)}
  select.stdsel{width:100%;margin-top:3px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:7px;font-size:10px;font-family:var(--sans)}
  #notesPanel textarea{width:100%;height:36px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px;font-size:9px;font-family:var(--sans);resize:vertical}
  #botNotes > div{margin-bottom:3px}

if(!window.storage){let _ls=null;try{_ls=localStorage;}catch(e){}window.storage={async get(k){if(!_ls)return null;try{const v=_ls.getItem(k);return v!=null?{value:v}:null;}catch(e){return null;}},async set(k,v){if(_ls)try{_ls.setItem(k,v);}catch(e){}}};}
const SUITS=['♠','♥','♦','♣'], RANKS={11:'J',12:'Q',13:'K',14:'A'};
const rankStr=r=>RANKS[r]||String(r);
function evaluate7(cards){const n=cards.length;const rc=new Array(15).fill(0), sc=[0,0,0,0];const bySuit=[[],[],[],[]];for(let i=0;i<n;i++){const c=cards[i];rc[c.rank]++;sc[c.suit]++;bySuit[c.suit].push(c.rank);}const sortedRanks=[];for(let r=14;r>=2;r--)for(let k=0;k<rc[r];k++)sortedRanks.push(r);const groups=[];for(let r=14;r>=2;r--)if(rc[r]>0)groups.push({r:r,c:rc[r]});groups.sort((a,b)=>b.c-a.c||b.r-a.r);const pat=groups.map(g=>g.c).join('');const hasRank=new Array(16).fill(false);for(let r=2;r<=14;r++)hasRank[r]=rc[r]>0;if(rc[14])hasRank[1]=true;let straightHi=0;for(let hi=14;hi>=6;hi--){if(hasRank[hi]&&hasRank[hi-1]&&hasRank[hi-2]&&hasRank[hi-3]&&hasRank[hi-4]){straightHi=hi;break;}}if(!straightHi&&hasRank[5]&&hasRank[4]&&hasRank[3]&&hasRank[2]&&hasRank[1])straightHi=5;let flushSuit=-1;for(let s=0;s<4;s++)if(sc[s]>=5){flushSuit=s;break;}if(flushSuit>=0){const fr=bySuit[flushSuit].sort((a,b)=>b-a);for(let i=0;i<=fr.length-5;i++){if(fr[i]-fr[i+4]===4)return[8,fr[i]];}if(fr.includes(14)&&fr.includes(5)&&fr.includes(4)&&fr.includes(3)&&fr.includes(2))return[8,5];}if(pat[0]==='4'){const q=groups[0].r;const kicker=sortedRanks.find(r=>r!==q);return[7,q,kicker];}if(pat[0]==='3'&&(groups[1]&&groups[1].c>=2)){const trips=groups.filter(g=>g.c===3).map(g=>g.r).sort((a,b)=>b-a);const tripR=trips[0];const pairR=groups.filter(g=>g.r!==tripR&&g.c>=2).map(g=>g.r).sort((a,b)=>b-a)[0];return[6,tripR,pairR];}if(flushSuit>=0){const fr=bySuit[flushSuit].sort((a,b)=>b-a).slice(0,5);return[5,...fr];}if(straightHi>0)return[4,straightHi];if(pat[0]==='3'){const t=groups[0].r;const ks=sortedRanks.filter(r=>r!==t).slice(0,2);return[3,t,...ks];}const pairs=groups.filter(g=>g.c===2).map(g=>g.r).sort((a,b)=>b-a);if(pairs.length>=2){const kicker=sortedRanks.find(r=>r!==pairs[0]&&r!==pairs[1]);return[2,pairs[0],pairs[1],kicker];}if(pairs.length===1){const p=pairs[0];const ks=sortedRanks.filter(r=>r!==p).slice(0,3);return[1,p,...ks];}return[0,...sortedRanks.slice(0,5)];}
function cmp(a,b){const n=Math.max(a.length,b.length);for(let i=0;i<n;i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x-y;}return 0;}
const CATS=['高牌(High Card)','一对(One Pair)','两对(Two Pair)','三条(Three of a Kind)','顺子(Straight)','同花(Flush)','葫芦(Full House)','四条(Four of a Kind)','同花顺(Straight Flush)'];
function freshDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({rank:r,suit:s});return d;}

const keyOf=c=>c.rank*4+c.suit;
function equity(hole, board, opp, iters){if(opp<=0) return 1;const dead=new Set([...hole,...board].map(keyOf));const pool=freshDeck().filter(c=>!dead.has(keyOf(c)));let win=0,tie=0;const need=5-board.length;const draw=need+opp*2;for(let it=0;it<iters;it++){for(let i=0;i<draw;i++){const j=i+((Math.random()*(pool.length-i))|0);const t=pool[i];pool[i]=pool[j];pool[j]=t;}let idx=0;const comm=board.concat(pool.slice(0,need)); idx=need;const heroScore=evaluate7(hole.concat(comm));let best=0,tied=false;for(let o=0;o<opp;o++){const oh=[pool[idx++],pool[idx++]];const sc=evaluate7(oh.concat(comm));const c=cmp(sc,heroScore);if(c>0){best=1;tied=false;break;}else if(c===0){tied=true;}}if(best===0){ if(tied) tie++; else win++; }}return (win+tie*0.5)/iters;}
function chen(hole){const [a,b]=hole.slice().sort((x,y)=>y.rank-x.rank);const hi=a.rank, lo=b.rank, suited=a.suit===b.suit, pair=hi===lo;const val=r=> r===14?10 : r===13?8 : r===12?7 : r===11?6 : r/2;let s=val(hi);if(pair){ s=Math.max(5,val(hi)*2); return s; }if(suited) s+=2;const gap=hi-lo-1;s-= gap===0?0 : gap===1?1 : gap===2?2 : gap===3?4 : 5;if(gap<=1 && hi<12) s+=1;return Math.round(Math.max(0,s));}

function solverEnumRange(board, tier, dead){const d=new Set(dead.map(keyOf));const pool=freshDeck().filter(c=>!d.has(keyOf(c)));const inR=(oh)=>{if(tier!=='arrive') return oppInRange(oh,board,tier);if(oppInRange(oh,board,'bet')) return true;const hi=Math.max(oh[0].rank,oh[1].rank);if(hi>=13) return true;if(oh[0].rank===oh[1].rank) return true;return false;};const combos=[];for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){const oh=[pool[i],pool[j]];if(inR(oh)) combos.push(oh);}if(combos.length>80){const step=combos.length/80;const out=[];for(let k=0;k<80;k++)out.push(combos[Math.floor(k*step)]);return out;}return combos;}

function riverCFR(heroHole, board, pot, bet, iters=1200){const heroR=solverEnumRange(board,'arrive',board.concat(heroHole));heroR.unshift(heroHole);const villR=solverEnumRange(board,'arrive',board.concat(heroHole));if(villR.length<4||heroR.length<4) return null;const W=heroR.map(h=>villR.map(v=>{const hk=new Set(h.map(keyOf));if(v.some(c=>hk.has(keyOf(c)))) return -1;const c=cmp(evaluate7(h.concat(board)),evaluate7(v.concat(board)));return c>0?1:c===0?0.5:0;}));const H=heroR.length, V=villR.length;const hReg=Array.from({length:H},()=>[0,0]);const vReg=Array.from({length:V},()=>[0,0]);const hStratSum=Array.from({length:H},()=>[0,0]);const vStratSum=Array.from({length:V},()=>[0,0]);function regretMatch(regrets){const pos = regrets.map(r=>Math.max(0,r));const sum = pos[0]+pos[1];if(sum<=0) return [0.5,0.5];return [pos[0]/sum, pos[1]/sum];}for(let t=1; t<=iters; t++){const weight = Math.sqrt(t);const hStrat = hReg.map(regretMatch);for(let h=0; h<H; h++){let evCheck=0, evBet=0, count=0;for(let v=0; v<V; v++){const eq = W[h][v];if(eq<0) continue;count++;const vStrat = regretMatch(vReg[v]);evCheck += eq * pot;evBet += vStrat[0]*pot + vStrat[1]*(eq*(pot+2*bet)-bet);}if(!count) continue;evCheck /= count;evBet /= count;const avgEV = hStrat[h][0]*evCheck + hStrat[h][1]*evBet;hReg[h][0] = Math.max(0, hReg[h][0] + evCheck - avgEV);hReg[h][1] = Math.max(0, hReg[h][1] + evBet - avgEV);hStratSum[h][0] += weight * hStrat[h][0];hStratSum[h][1] += weight * hStrat[h][1];}const vStrat = vReg.map(regretMatch);for(let v=0; v<V; v++){let evFold=0, evCall=0, count=0;for(let h=0; h<H; h++){const eq = W[h][v];if(eq<0) continue;const hBetProb = regretMatch(hReg[h])[1];if(hBetProb <= 1e-9) continue;count += hBetProb;evCall += hBetProb * ((1-eq)*(pot+2*bet)-bet);}if(count <= 1e-9){vStratSum[v][0] += weight*0.5;vStratSum[v][1] += weight*0.5;continue;}evCall /= count;evFold = 0;const avgEV = vStrat[v][0]*evFold + vStrat[v][1]*evCall;vReg[v][0] = Math.max(0, vReg[v][0] + evFold - avgEV);vReg[v][1] = Math.max(0, vReg[v][1] + evCall - avgEV);vStratSum[v][0] += weight * vStrat[v][0];vStratSum[v][1] += weight * vStrat[v][1];}}function avgStrat(stratSum){return stratSum.map(s=>{const total=s[0]+s[1];return total>0 ? [s[0]/total, s[1]/total] : [0.5,0.5];});}const HS = avgStrat(hStratSum);const VS = avgStrat(vStratSum);const heroSelf = HS[0];let evCheck=0, evBet=0, n0=0;for(let v=0; v<V; v++){const eq = W[0][v];if(eq<0) continue;n0++;evCheck += eq * pot;evBet += VS[v][0]*pot + VS[v][1]*(eq*(pot+2*bet)-bet);}if(n0){ evCheck/=n0; evBet/=n0; }let betFreq=0, valBet=0, bluffBet=0;for(let h=0; h<H; h++){betFreq += HS[h][1];let avgEq=0, cnt=0;for(let v=0; v<V; v++){ if(W[h][v]>=0){avgEq+=W[h][v];cnt++;} }if(cnt>0 && avgEq/cnt >= 0.5) valBet += HS[h][1];else bluffBet += HS[h][1];}betFreq /= H;const villCallFreq = VS.reduce((a,s)=>a+s[1],0) / V;const mdf = pot/(pot+bet);return {self: heroSelf, evCheck, evBet, betFreq,bluffRatio: (valBet+bluffBet)>0 ? bluffBet/(valBet+bluffBet) : 0,valBetRatio: (valBet+bluffBet)>0 ? valBet/(valBet+bluffBet) : 0,villCall: villCallFreq, mdf, nH: H, nV: V, iters,convergence: Math.abs(evCheck - evBet) < pot*0.02 ? 'tight' : 'wide'};}

/* ============================ 精确范围构建引擎 ============================ */
function expandRange(str) {
  const set = new Set();
  str.split(' ').forEach(token => {
    if (token.endsWith('+')) {
      const base = token.slice(0, -1);
      const ranks = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
      if (base.length === 2 && base[0] === base[1]) { 
        const startIdx = ranks.indexOf(base[0]);
        for (let i = startIdx; i < ranks.length; i++) set.add(ranks[i]+ranks[i]);
      } else if (base.length === 3) { 
        const hi = base[0], loStart = base[1], suit = base[2];
        const hiIdx = ranks.indexOf(hi), loIdx = ranks.indexOf(loStart);
        for (let i = loIdx; i < hiIdx; i++) set.add(hi + ranks[i] + suit);
      }
    } else { set.add(token); }
  });
  return set;
}
function filterPreflopCombos(combos, actionLine) {
  const ranges = {
    'vs_open': expandRange('77+ ATs+ AJo+ KTs+ KQo QTs+ JTs T9s 98s 87s 76s 65s 54s'),
    'vs_3bet': expandRange('TT+ AQs+ AQo AJs KQs QJs JTs A5s A4s A3s T9s 98s'),
    'vs_4bet': expandRange('QQ+ AKs AKo'),
  };
  const targetRange = ranges[actionLine];
  if (!targetRange) return combos; 
  return combos.filter(oh => targetRange.has(handNotation(oh)));
}
function filterPostflopCombos(combos, board, actionLine) {
  let evaluated = combos.map(oh => {
    const score = evaluate7(oh.concat(board));
    return { oh, score, cat: score[0] };
  });
  evaluated.sort((a, b) => cmp(b.score, a.score));

  // 【底层修复】河牌圈范围净化：剔除底牌完全无用且踢脚极小的纯垃圾牌，防止胜率被垫高
  if (board.length === 5 && actionLine === 'vs_bet') {
      const minBoardRank = Math.min(...board.map(c => c.rank));
      evaluated = evaluated.filter(e => {
          if (e.oh[0].rank < minBoardRank && e.oh[1].rank < minBoardRank && e.cat <= 1) {
              return false;
          }
          return true;
      });
  }

  // 【修复】使用更真实的范围构建：价值牌 + 中等牌 + 诈唬牌
  // 旧代码只保留top X%最强牌，移除了所有弱牌，导致hero胜率被严重高估
  const n = evaluated.length;
  let valuePct, bluffPct;
  if (actionLine === 'vs_reraise') {
    valuePct = 0.25;  // 面对re-raise: 25%价值
    bluffPct = 0.05;  // 5%诈唬
  } else if (actionLine === 'vs_raise') {
    valuePct = 0.45;  // 面对加注: 45%价值
    bluffPct = 0.10;  // 10%诈唬/半诈唬
  } else if (actionLine === 'vs_bet') {
    valuePct = 0.60;  // 面对下注: 60%价值
    bluffPct = 0.15;  // 15%诈唬
  } else if (actionLine === 'vs_check') {
    valuePct = 0.40;  // 对手过牌: 40%价值(强牌通常会下注，过牌偏中等/弱)
    bluffPct = 0.15;  // 15%弱牌/听牌
  } else if (actionLine === 'vs_call') {
    valuePct = 0.50;  // 对手跟注: 50%中等牌力(最差的弃牌，最好的加注)
    bluffPct = 0.05;  // 5%诈唬(诈唬通常弃牌或加注，很少跟注)
  } else {
    // default: 对手可能拿着任何进入底池的牌
    valuePct = 0.80;  // 80%范围
    bluffPct = 0.10;  // 10%诈唬
  }

  const result = [];
  const valueCount = Math.max(1, Math.floor(n * valuePct));

  // 添加价值牌 (top combos)
  for (let i = 0; i < valueCount; i++) result.push(evaluated[i].oh);

  // 添加诈唬牌 (从剩余牌中随机选取，模拟bluff频率)
  const remaining = evaluated.slice(valueCount);
  const bluffCount = Math.max(0, Math.min(Math.floor(n * bluffPct), remaining.length));
  if (bluffCount > 0 && remaining.length > 0) {
    // Fisher-Yates shuffle on remaining, take first bluffCount
    for (let i = remaining.length - 1; i > 0 && i > remaining.length - bluffCount - 1; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
    }
    for (let i = remaining.length - 1; i >= remaining.length - bluffCount; i--) {
      result.push(remaining[i].oh);
    }
  }

  return result;
}
function buildVillainRange(heroHole, board, actionLine) {
  const dead = new Set([...heroHole, ...board].map(keyOf));
  const pool = freshDeck().filter(c => !dead.has(keyOf(c)));
  const allCombos = [];
  for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) allCombos.push([pool[i], pool[j]]);

  const runSim = (iters) => {
    let w=0, t=0, v=0;
    for (let it = 0; it < iters; it++) {
      const vIdx = Math.floor(Math.random() * villainCombos.length);
      const vHole = villainCombos[vIdx];
      if (dead.has(keyOf(vHole[0])) || dead.has(keyOf(vHole[1]))) continue;
      const vDead = new Set([keyOf(vHole[0]), keyOf(vHole[1])]);
      const remainingPool = pool.filter(c => !vDead.has(keyOf(c)));
      if (remainingPool.length < need) continue;
      for (let i = 0; i < need; i++) {
        const j = i + Math.floor(Math.random() * (remainingPool.length - i));
        [remainingPool[i], remainingPool[j]] = [remainingPool[j], remainingPool[i]];
      }
      const comm = board.concat(remainingPool.slice(0, need));
      const c = cmp(evaluate7(vHole.concat(comm)), evaluate7(heroHole.concat(comm)));
      if (c > 0) { v++; } else if (c === 0) { t++; v++; } else { w++; v++; }
    }
    return {w, t, v};
  };

  win += res1.w; tie += res1.t; validSamples += res1.v;
  let eq = validSamples > 0 ? (win + tie * 0.5) / validSamples : 0.5;
  const isEdge = Math.abs(eq - potOdds) < 0.06 && potOdds > 0;
  if (isEdge) {
    let res2 = runSim(baseIters * 3);
    win += res2.w; tie += res2.t; validSamples += res2.v;
    eq = (win + tie * 0.5) / validSamples;
    // 【修复】移除不合理的0.96惩罚系数，边缘情况下额外采样已足够降低方差

/* ============================ 对手范围推断系统 ============================ */
function analyzeVillainRange(heroHole, board, actionLine) {
  const combos = buildVillainRange(heroHole, board, actionLine);
  if (combos.length === 0) return null;

  // Preflop: analyze range composition instead of hand strength
  if (board.length === 0) {
    const catCounts = { highPair: 0, broadway: 0, midPair: 0, suitedConnector: 0, smallPair: 0, other: 0 };
    const sampleHands = [];
    combos.forEach(oh => {
      const h = handNotation(oh);
      const [a, b] = oh.slice().sort((x, y) => y.rank - x.rank);
      const hi = a.rank, lo = b.rank;
      const pair = hi === lo;
      const suited = a.suit === b.suit;
      if (pair && hi >= 10) catCounts.highPair++;
      else if (pair && hi <= 6) catCounts.smallPair++;
      else if (pair) catCounts.midPair++;
      else if (hi >= 11 && lo >= 10) catCounts.broadway++;
      else if (suited && hi - lo <= 4 && hi >= 5) catCounts.suitedConnector++;
      else catCounts.other++;
      if (sampleHands.length < 6 && !sampleHands.includes(h)) sampleHands.push(h);
    });
    const total = combos.length;
    const categories = [
      { name: 'highPair', label: '高对(TT+)', count: catCounts.highPair, pct: Math.round(catCounts.highPair / total * 100) },
      { name: 'broadway', label: '百老汇(AK/AQ/KQ)', count: catCounts.broadway, pct: Math.round(catCounts.broadway / total * 100) },
      { name: 'midPair', label: '中对(77-99)', count: catCounts.midPair, pct: Math.round(catCounts.midPair / total * 100) },
      { name: 'suitedConnector', label: '同花连牌/小Axs', count: catCounts.suitedConnector, pct: Math.round(catCounts.suitedConnector / total * 100) },
      { name: 'smallPair', label: '小对(22-66)', count: catCounts.smallPair, pct: Math.round(catCounts.smallPair / total * 100) },
      { name: 'other', label: '其他', count: catCounts.other, pct: Math.round(catCounts.other / total * 100) }
    ].filter(c => c.count > 0);
    return { total, preflop: true, categories, sampleHands };
  }

  // Postflop: analyze hand strength vs board
  const cats = { monster: [], topPair: [], middlePair: [], draws: [], bluffs: [], air: [] };
  const maxBoardRank = board.length > 0 ? Math.max(...board.map(c => c.rank)) : 0;
  const minBoardRank = board.length > 0 ? Math.min(...board.map(c => c.rank)) : 0;

  combos.forEach(oh => {
    const score = evaluate7(oh.concat(board));
    const cat = score[0];
    const h = handNotation(oh);

    if (cat >= 3) { // Set+, Straight+, Flush+
      cats.monster.push(h);
    } else if (cat === 2) { // Two pair
      cats.topPair.push(h);
    } else if (cat === 1) { // One pair
      const pairRank = score[1];
      if (pairRank > maxBoardRank) cats.topPair.push(h); // Overpair (AA on J-7-2)
      else if (pairRank === maxBoardRank) cats.topPair.push(h); // Top pair
      else if (pairRank >= Math.round((maxBoardRank + minBoardRank) / 2)) cats.middlePair.push(h); // Middle pair
      else cats.bluffs.push(h); // Bottom pair / weak pair
    } else { // High card
      const drawInfo = heroDraw(oh, board);
      if (drawInfo && (drawInfo.flush || drawInfo.oesd)) cats.draws.push(h);
      else if (oh.some(c => c.rank >= 13)) cats.bluffs.push(h); // K-high or A-high bluff
      else cats.air.push(h);
    }
  });

  const total = combos.length;
  const value = cats.monster.length + cats.topPair.length;
  const bluffs = cats.draws.length + cats.bluffs.length + cats.air.length;
  const categories = [
    { name: 'monster', label: '超强(三条+/顺子+/同花+)', count: cats.monster.length, pct: Math.round(cats.monster.length / total * 100), samples: [...new Set(cats.monster)].slice(0, 4) },
    { name: 'topPair', label: '顶对/两对/超对', count: cats.topPair.length, pct: Math.round(cats.topPair.length / total * 100), samples: [...new Set(cats.topPair)].slice(0, 4) },
    { name: 'middlePair', label: '中对', count: cats.middlePair.length, pct: Math.round(cats.middlePair.length / total * 100), samples: [...new Set(cats.middlePair)].slice(0, 3) },
    { name: 'draws', label: '听牌(同花/顺子)', count: cats.draws.length, pct: Math.round(cats.draws.length / total * 100), samples: [...new Set(cats.draws)].slice(0, 4) },
    { name: 'bluffs', label: '诈唬(高牌/底对)', count: cats.bluffs.length, pct: Math.round(cats.bluffs.length / total * 100), samples: [...new Set(cats.bluffs)].slice(0, 3) },
    { name: 'air', label: '空气', count: cats.air.length, pct: Math.round(cats.air.length / total * 100), samples: [] }
  ].filter(c => c.count > 0);

  return { total, preflop: false, categories, valueVsBluff: { value, bluffs, valuePct: Math.round(value / total * 100), bluffPct: Math.round(bluffs / total * 100) } };
}

  return html;

  }

    if(score[1]>=maxR-1 && maxR<=12) return 'midPair';

function pioLookup(street, texture, handCat, context){
  const st = PIO_HAND_STRATEGY[street];
  if(!st) return null;
  const ctx = st[context];
  if(!ctx) return null;
  const texData = ctx[texture] || ctx['brick'];
  if(!texData) return null;
  return texData[handCat] || null;
}

function showCoach(){
  const co=document.getElementById('coach');

  if(!toggle || !toggle.checked){ co.classList.remove('show'); return; }

    const opp=activePlayers().length-1;
    const toCall=Math.max(0,G.currentBet-p.bet);
    const pot=G.pot, potOdds=toCall>0?toCall/(pot+toCall):0;
    
    let actionLine = 'default';
    if (G.street === 'preflop') {
      if (G.pfRaises >= 3) actionLine = 'vs_4bet';
      else if (G.pfRaises === 2) actionLine = 'vs_3bet';
      else if (G.currentBet > BB_AMT) actionLine = 'vs_open';
    } else {
      if (G.streetAggro >= 3) actionLine = 'vs_reraise';
      else if (G.streetAggro === 2) actionLine = 'vs_raise';
      else if (toCall > 0) actionLine = 'vs_bet';
      else {
        // 翻后无下注: 推断对手行动
        const villainActed = players.some((q, idx) => idx !== HUMAN && !q.folded && q.inHand && (q.checkedThisStreet || q.bet > 0));
        const anyVillainBet = players.some((q, idx) => idx !== HUMAN && !q.folded && q.inHand && q.bet > 0);
        if (anyVillainBet) actionLine = 'vs_call';       // 对手跟注了我的下注
        else if (villainActed) actionLine = 'vs_check';   // 对手过牌给我
        else actionLine = 'vs_check';                     // 我是先行动者，假设对手会过牌
      }
    }

    const villainCombos = buildVillainRange(p.hole, G.board, actionLine);
    const eqRes = preciseEquityAdaptive(p.hole, G.board, villainCombos, potOdds, 800);
    let eq = eqRes.eq;
    let eqRange = eqRes.eq;

    let eqR = 1.0;
    if (G.street === 'preflop' && toCall > 0) {
      const heroPos = posLabel(p.id);
      const villainPos = G.lastAggressor !== null ? posLabel(G.lastAggressor) : 'CO';
      const isIP = (heroPos === 'BTN') || (heroPos === 'CO' && ['UTG','UTG1','MP','MP1','HJ','SB'].includes(villainPos));
      // 【修复】更精细的翻前胜率实现率，基于实际GTO研究数据
      if (actionLine === 'vs_3bet') { eqR = isIP ? 0.88 : 0.75; }
      else { eqR = isIP ? 0.93 : 0.82; }
    }

    let escalationMultiplier = 1.0;
    if (G.street !== 'preflop') {
      // 【修复】escalationMultiplier过于激进，2bet/3bet的惩罚太重
      if (G.streetAggro === 1) escalationMultiplier = 1.0;
      else if (G.streetAggro === 2) escalationMultiplier = 0.92;
      else if (G.streetAggro >= 3) escalationMultiplier = 0.70;
    }

    const fairShare = 1/(opp+1);
    const eqP=(eq*100|0), poP=(potOdds*100|0), fsP=(fairShare*100|0);
    const fmt=n=>Math.round(n);

    const pfr = G.street!=='preflop' ? heroIsPFR() : null;
    const tex = G.street!=='preflop' ? boardTexture(G.board) : boardTexture([]);
    const spr = sprInfo(G.pot, p.stack);
    const btInfo = G.street!=='preflop' ? blockerSummary(p.hole, G.board) : [];
    const rioInfo = G.street!=='preflop'&&toCall>0 ? reverseImpliedOddsCheck(p.hole,G.board,eq,actionLine) : {warn:false,note:'',adjEq:eq};
    if(rioInfo.warn) eq = rioInfo.adjEq;
    const cbetSpot = isCbetSpot();
    const sFE = streetFE(G.street, pfr, opp);
    let fe = Math.max(0.08, sFE.base - (opp-1)*0.10);

    // 【修复】eqCalled惩罚过于激进，特别是低胜率时的0.68乘数
    let eqCalled = Math.max(0, eq * 0.92 - 0.02);

    let bStd;
    if(G.street==='preflop') bStd=3*BB_AMT;
    else if(tex.type==='dry_high' && pfr) bStd=Math.min(Math.max(BB_AMT,Math.round(pot*0.33/5)*5), p.stack);
    else if(tex.type==='wet' && eq>=0.55) bStd=Math.min(Math.max(BB_AMT,Math.round(pot*0.75/5)*5), p.stack);
    else bStd=Math.min(Math.max(BB_AMT,Math.round(pot*0.66/5)*5), p.stack);

    const evBet = fe*pot + (1-fe)*(eqCalled*(pot+2*bStd) - bStd);

    // 翻前弱牌实现率系数：弱牌在3bet/加注底池中被主导，实际胜率远低于原始胜率
    let eqCoeff = 1.0;
    if (G.street === 'preflop' && toCall > 0) {
      if (actionLine === 'vs_3bet') {
        if (eq < 0.30) eqCoeff = 0.60;
        else if (eq < 0.45) eqCoeff = 0.60 + (eq - 0.30) / 0.15 * 0.40;
        else eqCoeff = 1.0;
      } else if (actionLine === 'vs_4bet') {
        if (eq < 0.25) eqCoeff = 0.50;
        else if (eq < 0.40) eqCoeff = 0.50 + (eq - 0.25) / 0.15 * 0.50;
        else eqCoeff = 1.0;
      } else if (actionLine === 'vs_open') {
        if (eq < 0.30) eqCoeff = 0.72;
        else if (eq < 0.40) eqCoeff = 0.72 + (eq - 0.30) / 0.10 * 0.28;
        else eqCoeff = 1.0;
      }
    } else if (G.street !== 'preflop' && toCall > 0 && actionLine !== 'vs_reraise') {
      if (eq < 0.30) eqCoeff = 0.80;
      else if (eq < 0.45) eqCoeff = 0.80 + (eq - 0.30) / 0.15 * 0.20;

          RStd = Math.min(Math.round(G.currentBet * 2.3 / 5) * 5, p.bet + p.stack);
          const addR = RStd - p.bet;
          const totalInvested = RStd;
          // 手牌强度依赖: 弱牌4bet对手弃牌少, 强牌对手弃牌多
          const foldTo4bet = Math.min(0.50, 0.15 + eq * 0.40);
          const jam5bet = Math.min(0.35, 0.15 + (1 - eq) * 0.28);
          const call4bet = Math.max(0, 1.0 - foldTo4bet - jam5bet);
          const evFold = pot;
          const jamPot = pot + addR + totalInvested;
          // 弱牌被5bet jam时胜率极低
          const eqRealVsJam = Math.max(0.06, eq * 0.40 + 0.02);
          const evJam = eqRealVsJam * jamPot - totalInvested;
          const potAfterCall = pot + addR + (RStd - G.currentBet);

          const evPostflop = (eq * postflopReal - 0.18) * potAfterCall;

        } else if (actionLine === 'vs_open') {

          const totalInvested = RStd;
          // 手牌强度依赖: 垃圾牌3bet对手弃牌少(你牌弱对手不怕), 好牌对手弃牌多
          // eq低→foldTo3bet低(20-25%), eq高→foldTo3bet高(45-50%)
          const foldTo3bet = Math.min(0.50, 0.20 + eq * 0.35);
          const jam4bet = Math.min(0.28, 0.12 + (1 - eq) * 0.22);
          const call3bet = Math.max(0, 1.0 - foldTo3bet - jam4bet);
          const evFold = pot;
          const jamPot = pot + addR + totalInvested;
          const eqRealVsJam = Math.max(0.08, eq * 0.45 + 0.03);
          const evJam = eqRealVsJam * jamPot - totalInvested;
          const potAfterCall = pot + addR + (RStd - G.currentBet);
          // 弱牌翻后实现率大幅降低(位置+牌力双重劣势)
          const postflopReal = Math.max(0.20, eq * 0.45 + 0.08);
          const evPostflop = (eq * postflopReal - 0.20) * potAfterCall;
          evRaise = foldTo3bet * evFold + call3bet * evPostflop + jam4bet * evJam;
          feR = foldTo3bet;
        } else {
          RStd = p.bet + p.stack;
          const addR = RStd - p.bet;
          // 默认preflop加注(挤压/隔离): 手牌强度依赖
          const feDefault = Math.max(0.20, 0.50 - eq * 0.35);
          const callPct = Math.max(0, 1 - feDefault - 0.10);
          const potAfterCall = pot + addR + addR;
          const postflopReal = Math.max(0.30, eq * 0.55 + 0.12);
          const evWhenCalled = (eq * postflopReal - 0.15) * potAfterCall - addR;
          evRaise = feDefault * pot + callPct * evWhenCalled - 0.10 * addR;
          feR = feDefault;
        }
      } else {
        RStd = Math.min(G.currentBet+Math.max(G.minRaise||BB_AMT,Math.round(pot*0.72/5)*5), p.bet+p.stack);
        feR = Math.min(0.55, fe+0.06);
        if(G.street==='river' || actionLine === 'vs_reraise') feR=Math.min(0.25, fe+0.02);

        const fourBetPct = 0.03;
        const callPct = Math.max(0, 1-feR-fourBetPct);
        const evWhenCalled = (eqCalled*eqCoeff)*(pot+addR+callAmt)-addR;
        evRaise = feR*pot + callPct*evWhenCalled - fourBetPct*addR;

    let evOpen=null, openToPf=null;

      const callDead = new Set([...p.hole].map(keyOf));

          } else if(draw && (draw.flush||draw.oesd) && evRaise!=null && evRaise>(evCall||0)+3 && opp===1 && p.stack>toCall*3 && actionLine !== 'vs_reraise'){
            recAmt=RStd; rec=`半诈唬加注 Semi-Bluff Raise 到 ${RStd}`; verdict='ok';
            why=`强听牌(Strong Draw) + 加注EV显著高于跟注。半诈唬加注增加弃牌率，保留隐含赔率。`;
          } else if(eq * eqCoeff >= potOdds){
            if(freqMode && Math.abs(eq*eqCoeff-potOdds)<=0.04){
              const callPct = Math.round(Math.max(30,Math.min(85, (eq*eqCoeff-potOdds+0.04)/0.08*70+15)));
              mixFreq = {fold:100-callPct, call:callPct, raise:0};
              rec = `混合策略 Mixed: ${callPct}%跟注Call / ${100-callPct}%弃牌Fold`; verdict = 'warn';
              why = `精准胜率 ${eqP}% ≈ 底池赔率 ${poP}%，处于GTO无差异区间。均衡策略要求按频率混合。`;
            } else {
              rec='跟注 Call'; verdict='ok';
              why=`精准胜率 ${eqP}% ≥ 底池赔率 ${poP}%。跟注长期盈利(+EV)。${_pairedBoardWarn}${rioInfo.warn?'⚠️ '+rioInfo.note:''}`;
            }
          } else if(potOdds<0.18 && draw && (draw.flush||draw.oesd)){
            rec='跟注听牌 Call (Draw Odds)'; verdict='warn';
            why=`强听牌——${draw.flush?'同花听牌':'两头顺听牌'}，<b>${draw.outs}</b> 张补牌。底池赔率便宜(${poP}%)，隐含赔率使跟注有利。`;
          } else {
            rec='弃牌 Fold'; verdict='bad';
            why=`精准胜率 ${eqP}% < 底池赔率 ${poP}%。跟注长期亏损(-EV)，弃牌止损。`;
          }
        }
      }
    }

    // === PioSOLVER Distilled Enhancements ===
    let pioExtra = '';
    // 0. Pio decision badge (when Pio tables were primary source)
    if(G.street!=='preflop'){
      const _hc = classifyHand(p.hole, G.board);
      const _pCtx = toCall > 0 ? 'vsBet' : 'first';
      const _pio = pioLookup(G.street, tex.type, _hc, _pCtx);
      if(_pio){
        const catLabels = {nuts:'坚果(Nuts)',topPair:'顶对+(Top Pair+)',midPair:'中对(Mid Pair)',weakPair:'弱对(Weak Pair)',strongDraw:'强听牌(Strong Draw)',weakDraw:'弱听牌(Weak Draw)',air:'空气(Air)'};
        const catLabel = catLabels[_hc] || _hc;
        pioExtra += '<div style="margin-top:5px;padding:4px 8px;background:rgba(76,175,80,.10);border-left:3px solid #4caf50;border-radius:4px;font-size:10px;color:#81c784"><b>📊 PioSOLVER决策:</b> '+catLabel+' @ '+tex.note+' → Pio推荐: <b>'+_pio.a+'</b>'+(_pio.s?' '+(_pio.s*100|0)+'%pot':'')+(_pio.rs?' '+_pio.rs+'x':'')+' ('+((_pio.f*100)|0)+'%频率)</div>';
      }
    }
    // 1. Exploit adjustment based on villain style
    const villain = players.filter(x=>!x.human&&!x.folded&&x.inHand);
    const villainStyle = villain.length===1 && villain[0].arch ? Object.keys(STYLES).find(k=>STYLES[k]===villain[0].arch) : null;
    const exploitInfo = exploitAdjustment(p.hole, G.board, villainStyle, G.street, eq, potOdds);
    if(exploitInfo.adj && exploitInfo.adj!=='标准GTO'){
      pioExtra += `<div style="margin-top:5px;padding:4px 8px;background:rgba(232,185,74,.08);border-left:3px solid var(--gold);border-radius:4px;font-size:10px;color:var(--gold)"><b>⚡ 利用性 Exploit vs ${villainStyle}:</b> ${exploitInfo.adj} — ${exploitInfo.note}</div>`;
    }
    // 2. Multi-street plan
    if(G.street!=='preflop' && G.street!=='showdown'){
      const plan = multiStreetPlan(p.hole, G.board, G.street, eq, spr);
      if(plan) pioExtra += `<div style="margin-top:4px;font-size:10px;color:var(--text2)">${plan}</div>`;
    }
    // 3. PioSOLVER reference sizing
    if(G.street!=='preflop' && tex.type!=='preflop'){
      const score7 = evaluate7(p.hole.concat(G.board));
      const pioSz = pioSizing(G.street, tex.type, score7[0], spr.spr);
      pioExtra += `<div style="margin-top:3px;font-size:9px;color:var(--text3)">📊 Pio参考尺度: ${pioSz.label}</div>`;
    }
    // 4. Vs-bet reference frequencies
    if(toCall>0 && G.street!=='preflop' && PIO_STRATEGY.vsBet[G.street] && PIO_STRATEGY.vsBet[G.street][tex.type]){
      const vsb = PIO_STRATEGY.vsBet[G.street][tex.type];
      pioExtra += `<div style="margin-top:3px;font-size:9px;color:var(--text3)">📊 Pio面对下注参考: ${vsb.call}%跟注 / ${vsb.raise}%加注 / ${vsb.fold}%弃牌 (加注${vsb.rSz}x)</div>`;
    }

    co.classList.add('show');
    const eqLine = (toCall>0&&eqRange!=null)
      ? `<span style="color:var(--text2)">精准胜率(Precise Equity) <b>vs ${actionLine}</b> 范围: <span class="num">${eqP}%</span> · 底池赔率(Pot Odds) <span class="num">${poP}%</span>${G.street==='preflop'&&toCall>0?` · <span style="color:var(--warn)">实现率(EQ Realization) <b>${(eqR*100)|0}%</b></span>`:''}</span>`
      : `<span style="color:var(--text2)">胜率(Equity) <span class="num">${eqP}%</span>${toCall>0?' · 底池赔率(Pot Odds) <span class="num">'+poP+'%</span>':''}</span>`;

    let items;
    if(G.street==='preflop' && G.currentBet<=BB_AMT && posLabel(p.id)!=='BB'){
      items=[{label:'弃牌 Fold',val:0,rec:rec.includes('弃牌')}];
      if(evOpen!=null) items.push({label:`开池 Open ${openToPf}`,val:evOpen,rec:rec.includes('加注')||rec.includes('开池')});
    } else if(toCall>0){
      items=[{label:'弃牌 Fold',val:0,rec:rec.includes('弃牌')&&!rec.includes('混合')}];
      items.push({label:'跟注 Call',val:evCall||0,rec:rec.includes('跟注')||rec.includes('混合')});
      if(evRaise!=null) items.push({label:`加注 Raise ${RStd}`,val:evRaise,rec:rec.includes('加注')||rec.includes('3bet')});
    } else {

      items.push({label:`下注 Bet ${bStd}`,val:evBet,rec:rec.includes('下注')||rec.includes('Cbet')||rec.includes('半诈唬')});
    }

    let freqHtml = '';
    if(mixFreq && freqMode){
      freqHtml = `<div style="margin-top:8px;font-size:11px;color:var(--gold);font-weight:700">🎲 GTO混合频率(Mixed Strategy)</div>`;
      freqHtml += `<div class="strategy-bar" style="margin-top:4px">`;
      if(mixFreq.fold>0) freqHtml += `<div class="strat-fold" style="width:${mixFreq.fold}%">${mixFreq.fold>10?mixFreq.fold+'%':''}</div>`;
      if(mixFreq.call>0) freqHtml += `<div class="strat-call" style="width:${mixFreq.call}%">${mixFreq.call>10?mixFreq.call+'%':''}</div>`;
      if(mixFreq.raise>0) freqHtml += `<div class="strat-raise" style="width:${mixFreq.raise}%">${mixFreq.raise>10?mixFreq.raise+'%':''}</div>`;
      freqHtml += `</div>`;
    }

    lastCoachRec = rec;
    if(recAmt!=null){
      const rb=document.getElementById('bRaise');
      if(rb && !rb.disabled){
        const sl=document.getElementById('slider');
        const v=Math.min(Math.max(recAmt, +sl.min||0), +sl.max||recAmt);
        sl.value=v; updateSizeLabel();
      }
    }

    co.innerHTML=`
      <div class="coach-main">
        <span class="lead">👨‍🏫 ${rec}</span>
        <span class="verdict ${verdict}">${verdict==='ok'?'✓ 明确 Clear':verdict==='warn'?'⚠ 边缘/混合 Marginal':'✗ 亏损 -EV'}</span>
      </div>
      <div class="coach-brief">${why}</div>

        <summary>查看详细依据 View Details</summary>
        <div style="margin-top:6px">${eqLine}</div>
        <div style="font-size:10px;color:var(--text2);margin-top:6px;line-height:1.7">

          底池(Pot) <span class="num">${pot}</span> · 需跟注(To Call) <span class="num">${toCall}</span> · 对手(Opponents) <span class="num">${opp}</span>家 · SPR(筹码底池比) <span class="num">${spr.spr}</span> — <b>${spr.cat==='ultra_low'?'极低(打光)':spr.cat==='low'?'低(可三街打光)':spr.cat==='medium'?'中等(控池)':'深(小注控池)'}</b>
          ${btInfo.length?'<br><b>🛡️ 阻断牌(Blockers):</b> '+btInfo.join('；'):''}
          ${rioInfo.warn?'<br><span style="color:var(--warn)">⚠️ <b>反向隐含赔率(Reverse Implied Odds):</b> '+rioInfo.note+'</span>':''}
          <br><b>📈 估算数据 Estimates:</b><br>
          街层弃牌率(Fold Equity) <span class="num">${(fe*100|0)}%</span> · 行动线(Action Line) <b>${actionLine}</b>
          ${G.street!=='preflop' ? '<br><b>📐 GTO概念(GTO Concepts):</b><br>'+gtoConceptExplainer(G.street, tex, eq, potOdds, actionLine) : ''}
        </div>
      </details>`;
  }catch(e){
    console.error('showCoach error:',e);
    co.innerHTML=`<span style="color:var(--bad)">教练加载失败：${e.message||'未知错误'}</span>`;
    co.classList.add('show');
  }
}

function gtoConceptExplainer(street, tex, eq, potOdds, actionLine) {
  const concepts = [];

  if(street === 'flop') {
    if(tex.type === 'wet') {
      concepts.push('<b>湿润面(Wet Board)保护原则</b>: 牌面有很多听牌可能(Flush Draw/Straight Draw)，强牌需要大注(Heavy Bet)保护你的权益(Equity Protection)，减少对手听牌(Draw)的隐含赔率(Implied Odds)。过牌会让对手免费看到转牌(Free Card)，对持有者不利。');
    } else if(tex.type === 'dry_high') {
      concepts.push('<b>干燥高牌面(Dry High Board)策略</b>: 翻前加注者(PFR)在这类牌面有范围优势(Range Advantage)——你的范围里有更多高牌(AK/AQ)。GTO推荐小注高频持续下注(Small Bet, High Frequency Cbet)，约65-80%频率cbet，迫使对手的中等牌和弱牌弃牌。');
    } else {
      concepts.push('<b>干燥低牌面(Dry Low Board)策略</b>: 双方都不太容易中牌，范围都较弱。过牌频率(Check Frequency)增加，因为下注不太能让更差的牌跟注、更好的牌弃牌。中等牌力倾向于过牌控池(Pot Control)。');
    }
  }

  if(street === 'turn') {
    if(eq >= 0.60) {
      concepts.push('<b>转牌强牌(Turn Strong Hand)</b>: 考虑三街价值计划(Triple Barrel / 3-Street Value)。SPR低时可以计划打光筹码(Stack-off Plan)。强牌需要在转牌继续下注(Build Pot)，为河牌全下(River All-in)铺路。');
    } else if(eq >= 0.40 && eq < 0.60) {
      concepts.push('<b>转牌中等牌(Turn Medium Hand)</b>: GTO核心原则——<b>控池(Pot Control)</b>。中等牌下注会被更好的牌跟注(Called by Better)、更差的牌弃牌(Fold Worse)——这是最坏结果。过牌保持底池小，保留摊牌价值(Showdown Value)，避免被加注(Raise)赶出底池。');
    } else {
      concepts.push('<b>转牌弱牌(Turn Weak Hand)</b>: 考虑是否有足够的诈唬权益(Bluff Equity)来下注。如果弃牌率(Fold Equity)足够高，可以半诈唬(Semi-Bluff)或纯诈唬(Pure Bluff)。否则过牌(Check)等待河牌改善或寻找诈唬时机。');
    }
  }

  if(street === 'river') {
    if(actionLine === 'vs_bet') {
      const mdf = G.pot / (G.pot + (G.currentBet - players[HUMAN].bet));
      concepts.push(`<b>河牌最低防守频率(MDF / Minimum Defense Frequency)</b>: ${(mdf*100)|0}%。MDF = Pot / (Pot + Bet)，表示你需要用至少${(mdf*100)|0}%的范围防守，防止对手通过纯诈唬(Pure Bluff)获利。但注意：MDF是理论上限，实际防守频率取决于你的范围和对手的下注尺度。`);
      if(eq < potOdds) concepts.push('<b>纯数学弃牌(Pure Math Fold)</b>: 胜率(Equity)不足以跟注底池赔率(Pot Odds)。除非有明确的阅读(Read)认为对手在诈唬(Bluffing)，否则弃牌(Fold)是正确的数学决策。长期来看，跟注-EV的牌会持续亏损。');
    } else {
      if(eq >= 0.70) {
        concepts.push('<b>河牌强牌(River Strong Hand)极化下注(Polarized Bet)</b>: 胜率极高，下注获取最大价值(Max Value)。你的范围顶端(Top of Range)下大注，对手跟注范围(Calling Range)里最差的牌就是你范围的底线。极化策略(Polarization)让你的价值下注(Value Bet)和诈唬(Bluff)难以区分。');
      } else if(eq >= 0.50) {
        concepts.push('<b>河牌薄价值(Thin Value Bet)</b>: 用小注(Small Bet)提取价值(Extract Value)。注意对手可能加注(Raise)，薄价值下注的风险是被更好的牌跟注(Called by Better)或被加注后不得不弃牌(Fold to Raise)。确保你的下注尺度能让更差的牌跟注。');
      } else {
        concepts.push('<b>河牌弱牌(River Weak Hand)</b>: 如果没有足够的诈唬权益(Bluff Equity)和弃牌率(Fold Equity)，过牌(Check)或弃牌(Fold)是默认选择。河牌诈唬需要对手有足够的可弃牌范围(Foldable Range)。');
      }
    }
  }

  if(actionLine === 'vs_reraise') {
    concepts.push('<b>面对再加注(Facing Re-raise)</b>: 对手范围极度极化(Highly Polarized)——约90%是坚果/超强牌(Nuts/Value)，10%是空气/诈唬(Bluff)。用MDF原则(最低防守频率)决定继续范围(Continuing Range)，弃掉范围底部(Bottom of Range)。不要轻易用中等牌力跟注，因为大多数时候你落后(Dominated)。');
  }

  return concepts.join('<br><br>') || '根据GTO理论(Game Theory Optimal)做出最优决策，平衡你的价值下注(Value Bets)和诈唬(Bluffs)，让对手无法剥削你(Unexploitable)。';
}

const GRID_RANKS=[14,13,12,11,10,9,8,7,6,5,4,3,2];
function rankChar(r){ return r===14?'A':r===13?'K':r===12?'Q':r===11?'J':r===10?'T':String(r); }
function cellHand(i,j){const ri=GRID_RANKS[i], rj=GRID_RANKS[j];if(i===j) return {hi:ri,lo:ri,pair:true,suited:false,label:rankChar(ri)+rankChar(ri)};const hi=Math.max(ri,rj), lo=Math.min(ri,rj);const suited = i<j;return {hi,lo,pair:false,suited,label:rankChar(hi)+rankChar(lo)+(suited?'s':'o')};}
function currentHandKey(){const p=players[HUMAN];if(!G||G.over||p.folded||p.hole.length!==2) return null;const [a,b]=p.hole; const hi=Math.max(a.rank,b.rank), lo=Math.min(a.rank,b.rank);const pair=a.rank===b.rank, suited=a.suit===b.suit;return pair?`${hi}p`: `${hi}-${lo}-${suited?'s':'o'}`;}
function renderRange(){const pos=document.getElementById('rangePos').value;const posIdx=POS_ORDER[pos]??3;const cur=currentHandKey();let html='';for(let i=0;i<13;i++)for(let j=0;j<13;j++){const h=cellHand(i,j);const from=OPEN_FROM[h.label];const open = from!=null && from<=posIdx;const tb = THREEBET_VALUE.has(h.label);let cls='cell', bg;if(tb){ bg='var(--red)'; }else if(open){ bg='var(--gold)'; }else { bg='#2a3540'; cls+=' fold'; }const key = h.pair?`${h.hi}p`:`${h.hi}-${h.lo}-${h.suited?'s':'o'}`;if(cur && key===cur) cls+=' here';html+=`<div class="${cls}" style="background:${bg}" title="${h.label}">${h.label}</div>`;}document.getElementById('rangeGrid').innerHTML=html;}
document.getElementById('rangePos').addEventListener('change',renderRange);
function updateSidePanels(){const r=reads();const rows=[['手数', model.hands, null],['入池率 VPIP', r.vpip+'%', r.vpip],['翻前加注 PFR', r.pfr+'%', r.pfr],['翻后激进度', r.aggrPct+'%', r.aggrPct],['3bet频率', r.tb+'%', r.tb],['对持续下注弃牌', r.foldCbet+'%', r.foldCbet],['摊牌胜率', pct(model.wins,model.showdowns)+'%', pct(model.wins,model.showdowns)],];document.getElementById('stats').innerHTML=rows.map(([k,v,bar])=>{const b = bar!=null? `<div class="bar"><i style="width:${Math.min(100,bar)}%"></i></div>`:'';return `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>${b}`;}).join('');let read='';if(r.sample<6){ read=`样本仅 ${r.sample} 手，机器人仍按均衡策略。`; }else {const tags=[];if(r.vpip>=45 && r.aggrPct<=35) tags.push('<span class="lab">跟注站</span> 机器人将减少诈唬、加大价值。');else if(r.vpip<=20) tags.push('<span class="lab">紧</span> 机器人会更频繁偷盲。');if(r.foldCbet>=60) tags.push('<span class="lab">易弃牌</span> 机器人会提高cbet频率。');else if(r.foldCbet<=25 && r.faceCbet>=4) tags.push('<span class="lab">粘牌</span> 机器人会减少对你诈唬。');if(r.aggrPct>=65) tags.push('<span class="lab">激进</span> 机器人会用中强牌抓你诈唬。');if(tags.length===0) tags.push('打法均衡，暂无可剥削漏洞——高水平标志。');read=tags.map(t=>`<div style="margin-bottom:8px">${t}</div>`).join('');}document.getElementById('read').innerHTML=read;}
function logLine(txt,cls){if(G&&G.handLog) G.handLog.push(txt);const el=document.getElementById('log');const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=txt;el.prepend(d);while(el.children.length>120) el.removeChild(el.lastChild);}

/* ============================ 增强版输牌反思（漏洞检测）============================ */
function detectLeaks(){
  const r = reads();
  const leaks = [];
  if(r.sample < 20) return leaks;

  // VPIP too high
  if(r.vpip >= 35) leaks.push({ tag:'VPIP过高', severity:'high', detail:`入池率${r.vpip}%远超GTO建议(22-28%)。你在玩太多弱牌。`, fix:'收紧翻前范围，参考位置开池图表。' });
  if(r.vpip <= 15 && r.sample >= 30) leaks.push({ tag:'VPIP过紧', severity:'medium', detail:`入池率仅${r.vpip}%，容易被偷盲。`, fix:'在BTN/CO位适当放宽开池范围。' });

  // PFR gap
  const gap = r.vpip - r.pfr;
  if(gap >= 15) leaks.push({ tag:'VPIP-PFR差距过大', severity:'high', detail:`差距${gap}%——你太多时候只是跟注而非加注。`, fix:'减少冷跟注，要么加注要么弃牌。GTO倾向加注而非跟注。' });

  // Fold to cbet
  if(r.foldCbet >= 65 && r.faceCbet >= 5) leaks.push({ tag:'对cbet弃牌过多', severity:'high', detail:`面对持续下注弃牌${r.foldCbet}%，对手会一直cbet你。`, fix:'扩大防守范围，用更多听牌和弱对跟注。' });
  if(r.foldCbet <= 20 && r.faceCbet >= 5) leaks.push({ tag:'对cbet弃牌太少', severity:'medium', detail:`面对cbet几乎不弃牌(${r.foldCbet}%)，容易被价值打穿。`, fix:'对大注适当弃掉底对弱踢脚。' });

  // Aggression
  if(r.aggrPct <= 25) leaks.push({ tag:'翻后太被动', severity:'medium', detail:`激进度仅${r.aggrPct}%——你太少下注/加注。`, fix:'增加价值下注频率，加入半诈唬加注。' });
  if(r.aggrPct >= 70) leaks.push({ tag:'翻后过于激进', severity:'medium', detail:`激进度${r.aggrPct}%——你可能过度诈唬。`, fix:'选择更好的诈唬时机，用频率控制而非全攻。' });

  // 3bet频率检测
  if(r.tb > 0 && r.tb < 5 && r.sample >= 40) leaks.push({ tag:'3bet频率过低', severity:'medium', detail:`3bet频率仅${r.tb}%，你的翻前范围过于可预测。`, fix:'在BTN/CO位增加3bet频率，加入A5s/A4s等阻断牌诈唬3bet。' });
  if(r.tb > 12 && r.sample >= 40) leaks.push({ tag:'3bet频率过高', severity:'medium', detail:`3bet频率${r.tb}%偏高，容易被4bet剥削。`, fix:'收紧3bet范围，确保有足够的价值3bet支撑。' });

  // 摊牌胜率检测
  const sdWinRate = pct(model.wins, model.showdowns);
  if(sdWinRate < 40 && model.showdowns >= 10) leaks.push({ tag:'摊牌胜率过低', severity:'high', detail:`摊牌胜率仅${sdWinRate}%，说明你带着太弱的牌走到了摊牌。`, fix:'在转牌和河牌更严格地选择跟注，不要害怕弃掉中对/弱对。' });
  if(sdWinRate > 65 && model.showdowns >= 10) leaks.push({ tag:'摊牌胜率过高', severity:'low', detail:`摊牌胜率${sdWinRate}%很高——你可能弃掉了太多能赢的牌。`, fix:'扩大跟注范围，特别是在河牌面对小注时。' });

  return leaks;
}

function renderLeakReport(){
  const rp = document.getElementById('reflectionPanel');
  if(!rp) return;
  const leaks = detectLeaks();
  const losses = handHistory.filter(h => !h.won).slice(-10).reverse();

  let html = '';

  // Leak section
  if(leaks.length > 0){
    html += '<div style="background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.25);border-radius:8px;padding:10px 12px;margin-bottom:10px">';
    html += '<div style="font-size:12px;font-weight:700;color:var(--bad);margin-bottom:6px">🔍 检测到 ' + leaks.length + ' 个漏洞</div>';
    leaks.forEach(l => {
      const sevColor = l.severity === 'high' ? 'var(--bad)' : 'var(--warn)';
      html += `<div style="margin-bottom:6px;font-size:11px">
        <span style="color:${sevColor};font-weight:700;font-family:var(--mono);font-size:10px">[${l.severity==='high'?'严重':'注意'}]</span>
        <b style="color:var(--text)">${l.tag}</b>
        <div style="color:var(--text2);margin-top:2px">${l.detail}</div>
        <div style="color:var(--gold);margin-top:1px;font-size:10px">💡 ${l.fix}</div>
      </div>`;
    });
    html += '</div>';
  } else if(reads().sample >= 20){
    html += '<div style="font-size:11px;color:var(--good);margin-bottom:8px">✅ 暂未检测到明显漏洞，打法均衡。</div>';
  }

  // Existing loss analysis
  if(losses.length > 0){
    let foldCount=0, callLost=0, bluffCaught=0, badBeat=0;
    const coachIssues=[];
    losses.forEach(h=>{
      if(h.finalAction==='弃牌') foldCount++;
      else if(h.finalAction==='跟注' || h.finalAction==='过牌') callLost++;
      else if(h.finalAction.includes('加注') || h.finalAction.includes('下注')) bluffCaught++;
      if(h.coachAction==='弃牌' && h.finalAction!=='弃牌') coachIssues.push(h);
      if(h.showdown) badBeat++;
    });

    html += '<div style="font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px">📊 最近 ' + losses.length + ' 手输牌分析</div>';

    if(coachIssues.length>=2){
      html+='<div style="background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:11px;line-height:1.6">';
      html+='⚠️ <b>无视教练建议</b>：' + coachIssues.length + ' 次<br>';
      coachIssues.slice(0,3).forEach(h=>{
        html+=`<span style="color:var(--text2)">${h.hole} ${h.pos} 教练:<b style="color:var(--gold)">${h.coachRec}</b> 你:<b style="color:var(--bad)">${h.finalAction}</b></span><br>`;
      });
      html+='</div>';
    }
    if(callLost>=3) html+='<div style="font-size:11px;color:var(--bad);margin-bottom:4px">• 跟注输钱 ' + callLost + ' 次 → 跟注范围太宽</div>';
    if(bluffCaught>=2) html+='<div style="font-size:11px;color:var(--warn);margin-bottom:4px">• 诈唬被抓 ' + bluffCaught + ' 次</div>';
    if(badBeat>=3) html+='<div style="font-size:11px;color:var(--blue);margin-bottom:4px">• Bad Beat ' + badBeat + ' 次</div>';

    html+='<div style="margin-top:8px;font-family:var(--mono);font-size:10px;line-height:1.7;color:var(--text2)">';
    losses.slice(0,8).forEach(h=>{
      const actColor = h.finalAction===h.coachAction ? 'var(--good)' : 'var(--bad)';
      html+=`<span style="color:${actColor}">${h.hole.padEnd(4)} ${h.pos} → ${h.finalAction.padEnd(6)}</span> <span style="color:var(--bad)">${h.net>0?'+':''}${h.net}bb</span>`;
      if(h.coachRec!=='未记录' && h.finalAction!==h.coachAction) html+=` <span style="font-size:9px;color:var(--gold)">(教练:${h.coachRec})</span>`;
      html+='<br>';
    });
    html+='</div>';
  } else if(leaks.length === 0){
    html += '<span style="color:var(--text3)">打几手后显示分析…</span>';
  }

  rp.innerHTML = html;
}

// Coach expand/collapse
(function() {
  if (typeof document === 'undefined') return;
  document.addEventListener('DOMContentLoaded', function() {
    var wrap = document.getElementById('cwrap');
    var icon = document.getElementById('cicon');
    var coachEl = document.getElementById('coach');
    var coachX = document.getElementById('coachX');
    if (!wrap || !icon) return;

    icon.addEventListener('click', function(e) {
      e.preventDefault();
      wrap.classList.toggle('expanded');
    });

    // Close (✕) hides coach fully
    if (coachX) {
      coachX.addEventListener('click', function(e) {
        e.stopPropagation();
        coachEl.classList.remove('show');
        wrap.classList.remove('expanded');
      });
    }

    // Show dot when coach has content
    var obs = new MutationObserver(function() {
      var dot = icon.querySelector('.cdot');
      if (dot) dot.style.display = coachEl.classList.contains('show') ? 'block' : 'none';
    });
    obs.observe(coachEl, { attributes: true, attributeFilter: ['class'] });
  });
})();
